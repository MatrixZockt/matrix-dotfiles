# Memory safety: make the kernel reclaim in the background instead of in your app.
#
# 2026-11-19: with zram as the only swap the machine froze for minutes and then
# the OOM killer closed processes. Two things were wrong.
#
# 1. There was nothing to swap to once zram filled, so reclaim could not free
#    anything. Fixed outside this file: /swapfile (32 GiB, priority 10) sits
#    behind /dev/zram0 in /etc/fstab.
# 2. Even with swap, the default watermarks are tiny, so the *allocating* task
#    does the reclaim itself (direct reclaim) and the desktop stalls until the
#    OOM killer picks a victim. Raising the watermarks hands that work back to
#    kswapd, which reclaims in the background while the desktop keeps running.
#
# This file replaces 99-zram-swap.conf and 99-swap-pressure.conf, which set
# vm.swappiness to 150 and to 60 respectively: whichever loaded last won, so the
# effective value depended on file ordering. One file, one value.

# 60, not 150. With 30 GiB of RAM, 16 GiB of zram and 32 GiB of disk swap there
# is no reason to push hot application pages out of RAM: every fault on them
# costs a decompression or a disk read. zram is filled by the ordinary reclaim
# path anyway; 150 just evicted working sets to buy space that was not needed.
vm.swappiness = 60

# zram gains nothing from readahead (-1 would be ideal there), and disk swap is
# only the overflow tier, so keep readahead off.
vm.page-cluster = 0

# 256 MiB reserved (was 66 MiB, the kernel default for this RAM size). Below
# this the kernel enters direct reclaim from every allocation, which is exactly
# the state that looks like a frozen machine.
vm.min_free_kbytes = 262144

# Start background reclaim at min + 1% of a zone instead of min + 0.1%. This is
# the knob that turns "frozen until the OOM killer fires" into "slow but alive".
vm.watermark_scale_factor = 100
