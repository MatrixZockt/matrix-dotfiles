# Shared Chromium flags for Electron apps launched through the distro
# wrappers that read this file ($XDG_CONFIG_HOME/electron-flags.conf):
# code-oss (`code`/`code-oss`), electron39, electron42. Per-app files win:
# if ~/.config/<name>-flags.conf exists this file is not read at all, so put
# the same lines there when you create one.
#
# WHY (2026-10-23): Linux Chromium builds rasterise page tiles and decode
# video on the CPU by default. Compositing was already on the GPU, so the app
# looked "GPU accelerated" in a process check while the CPU still did every
# visible pixel of scrolling, animation and video. These flags move that work
# to the GPU (raster + zero-copy) and switch VA-API decoding on, which is off
# by default in every Electron build on Linux.
#
# Nothing here changes the display backend: an app that needs XWayland or
# native Wayland keeps choosing for itself (--ozone-platform is deliberately
# absent).
#
# Deliberately NO --ignore-gpu-blocklist: measured on Brave 2026-10-23, that
# switch made the GPU process open the NVIDIA render node as well and attempt
# Vulkan on a Wayland surface ("not compatible with Vulkan"). It buys nothing
# on this Intel display adapter and costs battery, so it is not here.
--enable-gpu-rasterization
# --enable-zero-copy was REMOVED here (2026-11-19): combined with a CPU
# compositor path it produced a fully white window (WhatsApp) and it buys one
# buffer copy. Rasterisation stays on the GPU without it.
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoDecoder,CanvasOopRasterization
