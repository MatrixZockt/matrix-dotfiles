# Settings for hold-SUPER dictation (custom/scripts/dictate-server.sh,
# dictate.sh and dictate-daemon.py all read this file).
#
# The model is the accuracy knob. `small` (what this used to hold) is fast but
# mishears; `large-v3-turbo` at q5_0 is the same whisper.cpp engine WhisperFlow
# runs, ~3x the size and worth every megabyte for the names and technical words
# that `small` mangled. It needs ~900 MiB of VRAM for model + compute buffers,
# which is why the local llama-server now keeps its KV cache in system RAM
# (see extras/optional/bin/llama-server-launch) -- the two did not fit
# together otherwise. Measured with both resident: 0.3-0.4 s per request.
MODEL=ggml-large-v3-turbo-q5_0.bin

# "auto" lets whisper detect the language per request; this machine dictates in
# German and English, and the multilingual turbo model handles both.
LANGUAGE=auto

DICTATE_PORT=8917
