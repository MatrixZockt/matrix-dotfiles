# Read by /usr/bin/brave (wrapper reads ~/.config/brave-flags.conf).
# Native Wayland, deterministically. --ozone-platform-hint=auto made the
# choice dependent on which env the launching context happened to have
# (dbus/systemd activation could lack WAYLAND_DISPLAY and fall back to X11);
# the explicit platform removes the ambiguity. Native Wayland is what makes
# Brave honour the monitor scale (1.5) instead of rendering tiny at 1x under
# XWayland's force_zero_scaling, and what makes its dropdown menus real
# xdg_popup surfaces instead of X11 override-redirect windows.
--ozone-platform=wayland
--password-store=basic

# Rendering: keep the pixels on the GPU, not the CPU (2026-10-23).
#
# Compositing alone already used the GPU, but Chromium still rasterises page
# tiles and decodes video on the CPU unless it is told otherwise on Linux:
# VA-API decoding is OFF by default in every Chromium build on this platform,
# so a single video makes the CPU the hottest thing in the machine while the
# GPU sits idle.
--enable-gpu-rasterization
# --enable-zero-copy was REMOVED here (2026-11-19): combined with a CPU
# compositor path it produced a fully white window (WhatsApp) and it buys one
# buffer copy. Rasterisation stays on the GPU without it.

# Deliberately NO --ignore-gpu-blocklist. Measured here 2026-10-23: with it,
# Brave's GPU process opened BOTH /dev/dri/renderD128 and renderD129 and logged
# "'--ozone-platform=wayland' is not compatible with Vulkan" -- the blocklist
# override makes it reach for the dGPU/Vulkan path. On a laptop that difference
# is battery life, so it stays out.

# ── WebGPU + video, settled by measurement (2026-10-28) ─────────────────────
#
# The story, because this ground has been fought over three times now:
#
#   1. ElevenLabs Studio said "Your browser can't use your graphics card ...
#      Issue: no-adapter": navigator.gpu.requestAdapter() returned null.
#   2. --enable-features=Vulkan fixed the adapter, but the GPU process then
#      died in a loop when ANGLE tried to present through Vulkan:
#        EGL_BAD_PARAMETER / DmaBufImageSiblingVkLinux / "Restarting GPU
#        process due to unrecoverable error". The window mapped, drew nothing.
#   3. Vulkan WITHOUT --use-angle (this file's previous state) gave a working
#      browser and an adapter -- and EVERY VIDEO BLACK. Measured with a probe
#      page: the decoder produced frames (total=24 dropped=0, readyState 4) and
#      no path painted them -- not the <video> element, not a 2D canvas
#      (drawImage), not a WebGPU texture. Its average RGB was 0,0,0 where the
#      clip is 121,129,131.
#   4. --enable-unsafe-webgpu instead of Vulkan made video paint again, but
#      Dawn fell back to SwiftShader (CPU). Correct -- and slow: 11 fps drawing
#      a 1280x720 video frame through WebGPU, about 2 fps on a big player. That
#      is the stutter that was reported.
#
# THE CAUSE of (3): Chromium was routing decoded video frames through
# GPU-memory buffers (dmabufs), which this driver cannot hand to the Vulkan
# path -- so every frame was dropped before it was ever composited.
# --disable-gpu-memory-buffer-video-frames keeps those frames in CPU memory,
# where Vulkan can still copy them. With it, Vulkan becomes usable:
#
#   Vulkan + that flag .... video paints 121,129,131, adapter intel/gen-12lp,
#                           WebGPU readback of a video frame 132,130,122
#   1280x720 through WebGPU  36 fps   (SwiftShader: 11)
#   1080x1440 through WebGPU 35 fps   (the decoder itself runs at 30/s)
#
# So: Vulkan is back, as a HARDWARE adapter, and the flag below is what keeps
# video visible. Do not remove either one alone -- Vulkan without the flag is
# a black screen for every video, and the flag without a Vulkan device buys
# nothing. --enable-unsafe-webgpu is gone: it was only ever a way to get an
# adapter without Vulkan, and it was the slow one.
#
# ── What this costs, measured 2026-10-28 (decode alone, no canvas work) ─────
#
# Keeping video frames in CPU memory also takes VA-API out of the picture: the
# hardware decoder's output IS a dmabuf, which is the thing that cannot cross
# into the Vulkan path. So decode is software now. Whole-browser cost of one
# video playing, nothing else happening:
#
#   1080p30, this config (software) ......  69% of one core
#   1080p30, no Vulkan (VA-API) ..........  27%
#   2160p30, this config (software) ...... ~160%
#   2160p30, no Vulkan (VA-API) ..........  29%
#
# Confirmed it is decode and not the flag guessing: the same 4K clip costs
# 162% with hardware decode allowed and 158% with --disable-accelerated-video-
# decode added -- no difference, so there was no hardware decode left to lose.
# At 1080p (what a video site actually plays) that is livable; 4K is where it
# hurts. The alternative -- VA-API back, ~29% at any resolution -- costs WebGPU
# entirely, i.e. ElevenLabs Studio does not load at all. If that trade is ever
# wanted for plain video watching, launch a second profile WITHOUT the Vulkan
# feature and WITHOUT the memory-buffer flag; do not mix the two here.
#
# Check (probe harness kept on purpose, all three live in /tmp):
#   python3 /tmp/vid-probe.py 8765 /tmp/r.json   then open http://127.0.0.1:8765/
#   python3 /tmp/fps-probe.py 8765 /tmp/f.json   then open .../?w=1280&h=720
# A healthy report is twoD ~121,129,131, wgpuReadback ~130, and webgpu fps at
# or above the clip's own 30/s.

# ONE --enable-features line: a second one would replace this one (Chromium
# keeps the last value of a repeated switch), silently dropping fractional
# scaling and bringing back the tiny-UI bug this file exists to fix.
--enable-features=WaylandFractionalScaleV1,VaapiVideoDecodeLinuxGL,VaapiVideoDecoder,CanvasOopRasterization,Vulkan
--disable-gpu-memory-buffer-video-frames

# ── Memory: a profile that keeps ~40 tabs and 43 renderers alive (2026-11-18)
#
# Measured with the browser as it stood: 57 Brave processes, 4.4 GB RSS, 43 of
# them renderers; the two oldest (2.7 days up) held 613 MB and 461 MB on their
# own, and Brave alone accounted for 800 MB of the machine's fully-used zram
# swap. A bare renderer costs 25-40 MB before it holds anything, so the process
# COUNT is what is worth attacking, not the page content.
#
# --process-per-site: one renderer per SITE instead of one per TAB. This
# profile is Google-heavy (Drive, Groups, Search, YouTube, Contacts), where
# dozens of tabs became dozens of renderers each mapping the same JS heap and
# the same shared libraries. Site isolation is preserved -- pages of different
# origins still get different processes -- so this is NOT the security trade
# that --renderer-process-limit makes. The cost is blast radius: a hang or
# crash on one Google tab takes the other Google tabs down with it.
#
# --disable-features=BackForwardCache: bfcache keeps a live snapshot of every
# page you navigate away from, which is why Back is instant -- and why each
# history entry costs a whole page's worth of memory. With it off, Back
# reloads. Remove this line if instant Back matters more than the RAM.
--process-per-site
--disable-features=BackForwardCache
