# Idle behavior.
#
# Idling NEVER turns the display off and NEVER suspends the machine. The panel
# drops into the configured idle mode instead -- dim, veil, eco or deep, see
# hypr/custom/scripts/screensaver.sh -- which keeps the picture on screen while
# it stops burning watts. Any input restores everything, including any
# compositor setting the mode borrowed.
#
#     hypr/custom/scripts/screensaver.sh ............ the idle sequence itself
#     hypr/custom/scripts/screensaver.sh --restore .. the wake path
#     Settings > General > Power & idle ............ which mode, and how dim
#
# Timeline:
#      5 min   the idle mode (visible either way) -- unless a video is being
#              watched: then nothing happens until it stops. "Watching" means
#              a fullscreen window somewhere AND audio actually flowing
#              (uncorked, unmuted) -- so music or a paused/muted fullscreen
#              window does NOT hold the screen.
#     resume   backlight back, compositor settings back (on any input)
#     20 sec   nothing, twice: a no-op listener that only exists so the first
#              input after it puts a screen back that was dimmed by something
#              other than the listener above (see the note on it below)
#
# There is deliberately no second, longer listener. A listener that suspends or
# blanks the panel after the dim is what used to happen here, and it is exactly
# what was asked to stop: a machine you cannot glance at is not "saving power",
# it is off. Suspending is still one click away in the session menu, and the
# battery-level suspend (Settings > General > Battery) is untouched -- that is
# about a dying battery, not about idling.
#
# Locking deliberately does NOT happen on idle: the session keeps running and
# visible (in the idle mode) is the point. SUPER+L locks explicitly when
# stepping away.
$screensaver_cmd = $HOME/.config/hypr/custom/scripts/screensaver.sh

# What every sleep does first: panel down, THEN the lock. Two things, in that
# order -- the header of that script is where the ordering is argued, and it is
# the whole reason it is a script instead of the one-liner it used to be.
#
# The short version: this hook runs while logind is still waiting out the delay
# inhibitor below, which is a five-second window. Raising the lock in it, and
# nothing else, paints the login screen on a lit panel for those five seconds.
$sleep_hook = $HOME/.config/hypr/custom/scripts/before-sleep.sh

general {
    # Dark, then lock, then sleep.
    #
    # WITHOUT this line a sleep resumes UNLOCKED -- a machine left at a desk
    # walks straight into the desktop on any keypress. Locking first is not
    # decoration: it is what makes "close the lid" safe to do in public at all.
    #
    # The session itself is never touched by a sleep: this machine suspends in
    # S3 (see /etc/systemd/sleep.conf.d/10-deep.conf and 50-lid-power.conf), so
    # every window is still in RAM and comes back behind this lock, which is
    # exactly the point.
    before_sleep_cmd = $sleep_hook

    # On resume: the panel comes back first (an output that is off stays off
    # until something asks for it -- screensaver.sh's wake_now, which this
    # calls, is that something), then the backlight and the compositor settings.
    # The lock from the hook is still up, so this reveals the login prompt.
    #
    # It is a SCRIPT, not `$screensaver_cmd --restore`, because a resume needs a
    # second thing that has nothing to do with the screen: this machine's speaker
    # amplifier is enabled by codec register writes (razer-speakers.service) that
    # a suspend/reset WIPES, and the service only ran at boot -- so every wake
    # came back silent. after-resume.sh runs the restore above and then restarts
    # that service. See the script's header for the whole story.
    after_sleep_cmd = $HOME/.config/hypr/custom/scripts/after-resume.sh
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5 mins
    on-timeout = $screensaver_cmd
    on-resume = $screensaver_cmd --restore
}

# The safety net, and it is written to be boring on purpose: it dims NOTHING.
#
# The listener above both dims and undims, so it can only put back a dim it
# applied itself. A dim that came from somewhere else -- the "preview this mode"
# button in Settings, a manual run of the script, or a hypridle that was
# restarted while the screen was already dark -- has no undo button attached to
# it, and a screen stuck at 1% backlight is the one failure mode here that the
# user cannot see their way out of without knowing about brightnessctl.
#
# This listener fires its (empty) timeout after 20 idle seconds and, on the
# first input after that, restores everything. Because the timeout does nothing,
# it can never turn a bright screen dark: the only thing it can do is put a dark
# screen back. Restoring when nothing is dimmed is a no-op -- the brightness
# value it would apply is not there to apply.
#
# `ignore_inhibit` so it keeps tracking idleness even when a program has asked
# the desktop not to idle: an inhibitor should stop the screen from dimming, not
# stop it from coming back.
listener {
    timeout = 20 # 20s
    on-timeout = /bin/true
    on-resume = $screensaver_cmd --restore
    ignore_inhibit = true
}

# The long-idle tier, tuned by the Power app (extras/bin/power-profiles-app).
#
# This is NOT "the screen goes dark after 10 minutes". The 5-minute listener
# above already put the panel into its idle mode; what THIS one adds, when the
# user armed it, is panel-off (DPMS) plus optional suspend after a further
# quiet delay -- and it only ever fires through screensaver.sh --long-idle,
# which re-checks the video guard and the armed marker before doing anything.
# Disarmed (the default, and after every boot), this listener is a no-op with
# an on-resume: its timeout is /bin/true, exactly like the safety net above.
listener {
    timeout = 600 # 10 min -- the delay itself is re-checked by the script
    on-timeout = $screensaver_cmd --long-idle
    on-resume = $screensaver_cmd --restore
    ignore_inhibit = true
}
